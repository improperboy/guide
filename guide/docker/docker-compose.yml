version: '3.8'

services:

  app:
    build: .
    container_name: myapp
    ports:
      - "3000:3000"

    volumes:
      - .:/app

    environment:
      - NODE_ENV=production

    depends_on:
      - db

  db:
    image: mysql:8

    container_name: mysql_db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: